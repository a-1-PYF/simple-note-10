<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>记事本</title>
    <style>
        .box{width:600px;margin:30px auto;}
        textarea{width:100%;height:120px;padding:10px;box-sizing:border-box;}
        .item{padding:8px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;}
        .del{color:red;cursor:pointer;}
    </style>
</head>
<body>
<div class="box">
    <h3>笔记</h3>
    <textarea id="noteInput" placeholder="输入笔记内容"></textarea>
    <button onclick="addNote()">添加</button>
    <div id="list"></div>
</div>
<script>
function addNote(){
    let val = document.getElementById('noteInput').value.trim();
    if(!val) return;
    let div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span>${val}</span><span class="del" onclick="this.parentElement.remove()">删除</span>`;
    document.getElementById('list').appendChild(div);
    document.getElementById('noteInput').value = '';
}
</script>
</body>
</html>
