<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>简易笔记工具</title>
    <style>
        .box{width:600px;margin:30px auto;}
        textarea{width:100%;height:120px;padding:8px;box-sizing:border-box;}
        button{margin:8px 0;padding:6px 12px;cursor:pointer;}
        .item{border:1px solid #ccc;padding:10px;margin:8px 0;display:flex;justify-content:space-between;}
    </style>
</head>
<body>
<div class="box">
    <h3>我的笔记</h3>
    <textarea id="noteInput" placeholder="在这里写笔记"></textarea>
    <br>
    <button onclick="saveNote()">添加笔记</button>
    <div id="noteList"></div>
</div>
<script>
function getNotes(){
    let data = localStorage.getItem("notes");
    return data ? JSON.parse(data) : [];
}
function render(){
    let arr = getNotes();
    let html = "";
    arr.forEach((item,idx)=>{
        html += `<div class="item">${item}<button onclick="del(${idx})">删除</button></div>`
    })
    document.getElementById("noteList").innerHTML = html;
}
function saveNote(){
    let val = document.getElementById("noteInput").value.trim();
    if(!val) return;
    let arr = getNotes();
    arr.push(val);
    localStorage.setItem("notes",JSON.stringify(arr));
    document.getElementById("noteInput").value="";
    render();
}
function del(idx){
    let arr = getNotes();
    arr.splice(idx,1);
    localStorage.setItem("notes",JSON.stringify(arr));
    render();
}
render();
</script>
</body>
</html>
